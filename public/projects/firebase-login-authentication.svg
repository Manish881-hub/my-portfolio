  <rect x="180" y="60" width="200" height="80" rx="6" fill="rgba(255,255,255,0.08)"/><rect x="190" y="70" width="80" height="6" rx="3" fill="rgba(255,255,255,0.15)"/><rect x="190" y="84" width="140" height="4" rx="2" fill="rgba(255,255,255,0.08)"/><rect x="400" y="60" width="200" height="80" rx="6" fill="rgba(255,255,255,0.08)"/><rect x="410" y="70" width="80" height="6" rx="3" fill="rgba(255,255,255,0.15)"/><rect x="410" y="84" width="140" height="4" rx="2" fill="rgba(255,255,255,0.08)"/><rect x="180" y="160" width="420" height="140" rx="6" fill="rgba(255,255,255,0.08)"/><rect x="190" y="170" width="168" height="6" rx="3" fill="rgba(255,255,255,0.15)"/><rect x="190" y="184" width="294" height="4" rx="2" fill="rgba(255,255,255,0.08)"/>
